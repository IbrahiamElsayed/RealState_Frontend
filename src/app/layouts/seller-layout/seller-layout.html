<div class="seller-layout">
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.2c1.4 1.3 4.2 3.8 6.4 5.8H5.6L12 5.2z"
            />
          </svg>
        </div>
        <div class="brand-text">
          <h2>RealEstate</h2>
          <span>Seller Panel</span>
        </div>
      </div>

      <div class="menu-label">Main Menu</div>
      <nav class="menu">
        <a routerLink="/seller/dashboard" routerLinkActive="active">
          <span class="menu-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
          </span>
          <span class="menu-text">Dashboard</span>
          <span class="menu-indicator"></span>
        </a>
        <a routerLink="/seller/properties" routerLinkActive="active">
          <span class="menu-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </span>
          <span class="menu-text">My Properties</span>
          <span class="menu-indicator"></span>
        </a>
        <a routerLink="/seller/messages" routerLinkActive="active">
          <span class="menu-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </span>
          <span class="menu-text">Messages</span>
          <span class="menu-indicator"></span>
        </a>
        <a routerLink="/seller/notifications" routerLinkActive="active">
          <span class="menu-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </span>
          <span class="menu-text">Notifications</span>
          <span class="menu-indicator"></span>
        </a>
        <a routerLink="/seller/profile" routerLinkActive="active">
          <span class="menu-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span class="menu-text">Profile</span>
          <span class="menu-indicator"></span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar">
            {{ user && user.username ? user.username.charAt(0).toUpperCase() : 'S' }}
          </div>
          <div class="user-info">
            <h4>{{ user?.username || 'Seller' }}</h4>
            <p>{{ user?.email || 'RealEstate Partner' }}</p>
          </div>
          <div class="user-status"></div>
        </div>
        <button class="logout-btn" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="breadcrumb">
          <a routerLink="/home">Home</a>
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="9 18 15 12 9 6" />
          </svg>
          <span>Seller</span>
        </div>
      </div>
      <div class="top-bar-right">
        <a routerLink="/seller/add-property" class="add-btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add Property
        </a>
      </div>
    </div>
    <div class="page-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
