<div class="payment-page">
  <div class="payment-card">
    <div class="payment-icon fail-icon">
      <svg
        width="44"
        height="44"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
    </div>
    <h1>Payment Cancelled</h1>
    <p class="payment-message">Your reservation was not completed. No payment has been recorded.</p>
    <div class="payment-details-card" style="text-align: center">
      <p style="margin: 0; font-size: 14px; color: var(--text-muted)">
        You can browse other properties or try again at any time.
      </p>
    </div>
    <div class="payment-actions">
      <a routerLink="/browse" class="btn-primary">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        Browse Properties
      </a>
      <a routerLink="/home" class="btn-secondary">Back to Home</a>
    </div>
  </div>
</div>
