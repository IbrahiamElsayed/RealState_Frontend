<div class="chat-wrap">
  <div class="chat-card">
    <div class="chat-top">
      <div class="chat-top-left">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span>Messages</span>
      </div>
      @if (selectedUserId) {
        <span class="chat-top-right">Chatting with seller</span>
      }
    </div>

    <div class="chat-msgs" #scrollContainer>
      @for (m of service.messages(); track m) {
        <div
          class="chat-bubble"
          [class.chat-bubble-me]="m.senderId === currentUserId"
          [class.chat-bubble-other]="m.senderId !== currentUserId"
        >
          <div>{{ m.content }}</div>
          <div class="chat-bubble-meta">
            <span class="chat-bubble-time">{{ m.sentAt | date: 'shortTime' }}</span>
            @if (m.senderId === currentUserId) {
              <svg
                class="chat-bubble-check"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
              </svg>
            }
          </div>
        </div>
      }
      @if (service.messages().length === 0) {
        <div class="chat-empty">
          <svg
            width="44"
            height="44"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          <p>No messages yet. Say hello!</p>
        </div>
      }
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        [(ngModel)]="message"
        (keyup.enter)="send()"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button class="chat-send" (click)="send()" [disabled]="!message.trim()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>
</div>
